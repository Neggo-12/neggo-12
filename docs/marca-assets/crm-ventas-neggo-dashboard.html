  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; }
  .col {

    min-width: 260px; max-width: 260px; padding: 10px; flex-shrink: 0;

    font-size: 13px; font-weight: 600; padding: 6px 4px 12px;
  }

    background: rgba(255,255,255,0.08); border-radius: 999px; padding: 2px 8px; font-size: 11px;
  }
  .card {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 12.5px;
    cursor: pointer;

  .card:hover { border-color: var(--muted); }
  .card .name { font-weight: 600; margin-bottom: 4px; }
  .card .meta { color: var(--muted); font-size: 11px; }
  .card .grande {
    display: inline-block; background: var(--amber); color: #080A0C; font-size: 10px;
    border-radius: 6px; padding: 1px 6px; margin-top: 6px; font-weight: 700;
  }
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 10; padding: 24px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 22px;
  }
  .modal h2 { margin: 0 0 4px; font-size: 17px; }
  .modal .row { margin-bottom: 12px; }
  .modal .row label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
  .modal .row .val { font-size: 13px; white-space: pre-wrap; line-height: 1.5; }
  .modal .close { float: right; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }

const ETAPAS = ["Por enviar", "Contactado", "Respondió", "Agendado", "Cerrado - ganado", "Perdido", "Descartado"];
const COLORS = {"Por enviar": "#7588A3", "Contactado": "#3B82F6", "Respondió": "#F59F0A", "Agendado": "#A855F7", "Cerrado - ganado": "#10B77F", "Perdido": "#EF4444", "Descartado": "#4B5563"};

function renderStats(rows) {
  const total = rows.length;
  const grandes = rows.filter(r => r["Cuenta grande"] === "Sí").length;
  const respondieron = rows.filter(r => r["Etapa"] === "Respondió").length;
  const cerrados = rows.filter(r => r["Etapa"] === "Cerrado - ganado").length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${total}</b>Total prospectos</div>
    <div class="stat"><b>${grandes}</b>Cuenta grande</div>
    <div class="stat"><b>${respondieron}</b>Respondieron</div>
    <div class="stat"><b>${cerrados}</b>Cerrados</div>
  `;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function renderBoard() {
  const q = document.getElementById('search').value.toLowerCase();
  const canal = document.getElementById('filterCanal').value;
  const grande = document.getElementById('filterGrande').value;

  const filtered = DATA.filter(r => {
    if (canal && r["Canal principal"] !== canal) return false;
    if (grande && r["Cuenta grande"] !== grande) return false;
    if (q) {
      const blob = (r["Nombre negocio / contacto"] + " " + r["Categoría"] + " " + r["Contacto"]).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });

  renderStats(filtered);

  const board = document.getElementById('board');
  board.innerHTML = '';
  ETAPAS.forEach(etapa => {
    const items = filtered.filter(r => r["Etapa"] === etapa);
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `<div class="col-header"><span style="color:${COLORS[etapa]}">${etapa}</span><span class="col-count">${items.length}</span></div>`;
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="name">${escapeHtml(item["Nombre negocio / contacto"])}</div>
        <div class="meta">${escapeHtml(item["Categoría"])} · ${escapeHtml(item["Canal principal"])}</div>
        ${item["Cuenta grande"] === "Sí" ? '<span class="grande">CUENTA GRANDE</span>' : ''}
      `;
      card.onclick = () => openModal(item);
      col.appendChild(card);
    });
    board.appendChild(col);
  });
}

function openModal(item) {
  const modal = document.getElementById('modal');
  const fields = [
    ["ID", item["ID"]],
    ["Categoría", item["Categoría"]],
    ["Tipo de perfil", item["Tipo de perfil"]],
    ["Canal / Contacto", item["Canal principal"] + " — " + item["Contacto"]],
    ["Gancho de personalización", item["Gancho de personalización"]],
    ["Mensaje armado/enviado", item["Mensaje armado/enviado"]],
    ["Respuesta real del negocio", item["Respuesta real del negocio (texto literal)"]],
    ["Respuesta sugerida (Ventas)", item["Respuesta sugerida (Ventas)"]],
    ["Próxima acción", item["Próxima acción"]],
    ["Notas", item["Notas"]],
  ];
  modal.innerHTML = `
    <button class="close" onclick="closeModal()">&times;</button>
    <h2>${escapeHtml(item["Nombre negocio / contacto"])}</h2>
    <div class="subtitle" style="margin-bottom:16px;color:${COLORS[item["Etapa"]]}">${escapeHtml(item["Etapa"])}</div>
    ${fields.filter(f => f[1]).map(f => `
      <div class="row"><label>${f[0]}</label><div class="val">${escapeHtml(f[1])}</div></div>
    `).join('')}
  `;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').onclick = (e) => { if (e.target.id === 'modalBg') closeModal(); };

// Poblar filtro de canal
const canales = [...new Set(DATA.map(r => r["Canal principal"]).filter(Boolean))].sort();
const sel = document.getElementById('filterCanal');
canales.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = c;
  sel.appendChild(opt);
});

document.getElementById('search').addEventListener('input', renderBoard);
document.getElementById('filterCanal').addEventListener('change', renderBoard);
document.getElementById('filterGrande').addEventListener('change', renderBoard);

renderBoard();
</script>
</body>
</html>
